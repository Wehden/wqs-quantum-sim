# Discovery only. Invoke from the repository root through the existing API server:
# SKYPILOT_CONFIG="$PRIVATE_SKY_CONFIG" sky launch \
#   tests/fixtures/physics/gpu/skypilot.yaml -c "$OWNED_CLUSTER" --down -y
# If provisioning/setup fails, terminate the owned allocation with sky down.
name: wqs-physics-gpu-discovery
resources:
  cloud: runpod
  accelerators: RTX4090:1
  cpus: 4+
  memory: 16+
  disk_size: 40
file_mounts:
  /opt/wqs-probe-gpu.py: ./spec/physics-engines/probe_gpu.py
setup: |
  set -euo pipefail
  apt-get update -qq
  apt-get install -y -qq git ca-certificates libgomp1 curl
  curl -LsSf https://astral.sh/uv/0.11.6/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
  uv python install 3.12.13
  uv venv --python 3.12.13 /opt/wqs-discovery
  uv pip install --python /opt/wqs-discovery/bin/python numpy==2.5.4 scipy==1.18.1 qutip==5.3.1 scqubits==4.3.1 'cupy-cuda12x[ctk]==14.2.0' cuda-pathfinder==1.8.4 cuda-toolkit==12.9.2.0 nvidia-cublas-cu12==12.9.2.10 nvidia-cuda-nvrtc-cu12==12.9.86 nvidia-cuda-runtime-cu12==12.9.79 nvidia-cufft-cu12==11.4.1.4 nvidia-curand-cu12==10.3.10.19 nvidia-cusolver-cu12==11.7.5.82 nvidia-cusparse-cu12==12.5.10.65 nvidia-nvjitlink-cu12==12.9.86 'git+https://github.com/qutip/qutip-cupy.git@bd471ca0581fcd9a84e613775092bca418d0b66a'
  uv pip check --python /opt/wqs-discovery/bin/python
  id wqs-discovery >/dev/null 2>&1 || useradd --create-home wqs-discovery
  chmod -R a+rX /opt/wqs-discovery /root/.local/share/uv/python
  # uv Python interpreter is inside root home: make a dedicated traversable copy.
  cp -aL /root/.local/share/uv/python /opt/wqs-python
  REAL_PYTHON=$(readlink -f /opt/wqs-discovery/bin/python)
  PUBLIC_PYTHON=/opt/wqs-python/${REAL_PYTHON#/root/.local/share/uv/python/}
  ln -sf "$PUBLIC_PYTHON" /opt/wqs-discovery/bin/python
run: |
  set -uo pipefail
  # SkyPilot file mounts may traverse the operator home; copy for the nonroot child.
  install -m 644 /opt/wqs-probe-gpu.py /opt/wqs-probe-gpu-exec.py
  failed=0
  mkdir -p /tmp/wqs-discovery-receipts
  sha256sum /opt/wqs-probe-gpu-exec.py
  nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
  for mode in init cpu gpu; do
    case "$mode" in
      init) args="--backend gpu --case cuda_init --init-profile 8";;
      cpu) args="--backend cpu --suite";;
      gpu) args="--backend gpu --suite --gpu-discovery-8g";;
    esac
    echo "WQS_PROBE_BEGIN $mode"
    runuser -u wqs-discovery -- env PATH=/opt/wqs-discovery/bin:/usr/local/bin:/usr/bin:/bin OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 CUPY_CACHE_DIR=/tmp/wqs-cupy-cache /opt/wqs-discovery/bin/python /opt/wqs-probe-gpu-exec.py $args
    code=$?
    echo "WQS_PROBE_EXIT $mode $code"
    if [ "$code" -ne 0 ]; then failed=1; fi
  done
  exit "$failed"

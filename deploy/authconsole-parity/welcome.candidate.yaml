# CANDIDATE ONLY: reviewed image pin; separate approval required before apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wqs-welcome
  namespace: qsim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wqs-welcome-registry-reader
  namespace: qsim
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - qsim-users
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wqs-welcome-registry-reader
  namespace: qsim
subjects:
- kind: ServiceAccount
  name: wqs-welcome
  namespace: qsim
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wqs-welcome-registry-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wqs-welcome
  namespace: qsim
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wqs-welcome
  template:
    metadata:
      labels:
        app: wqs-welcome
    spec:
      serviceAccountName: wqs-welcome
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: provider
        image: laminarflow:30500/qsim/admin-console@sha256:e8eeb14e4582bd401ef1615d56d30d2391a96fcfe1c91f0199e8e620b650f90b
        command:
        - python
        - -m
        - qsim.welcome_provider
        ports:
        - name: https
          containerPort: 8443
        env:
        - name: QSIM_DATA
          value: /data
        - name: WQS_WELCOME_BINDING_FILE
          value: /run/welcome/binding.json
        - name: WQS_WELCOME_AUTH_FILE
          value: /run/welcome/auth.json
        - name: WQS_WELCOME_INTEGRITY_KEY_FILE
          value: /run/welcome/integrity-key
        - name: WQS_WELCOME_TLS_CERT_FILE
          value: /run/welcome-tls/tls.crt
        - name: WQS_WELCOME_TLS_KEY_FILE
          value: /run/welcome-tls/tls.key
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        - name: config
          mountPath: /run/welcome
          readOnly: true
        - name: tls
          mountPath: /run/welcome-tls
          readOnly: true
        readinessProbe:
          exec:
            command:
            - python
            - -m
            - qsim.welcome_provider
            - --check
          timeoutSeconds: 20
          periodSeconds: 60
        livenessProbe:
          tcpSocket:
            port: https
          periodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: qsim-data-evac-20261016
          readOnly: true
      - name: config
        secret:
          secretName: wqs-welcome-auth
          defaultMode: 288
      - name: tls
        secret:
          secretName: wqs-welcome-tls
          defaultMode: 288
      nodeSelector:
        kubernetes.io/hostname: laminarflow
---
apiVersion: v1
kind: Service
metadata:
  name: wqs-welcome
  namespace: qsim
spec:
  type: ClusterIP
  selector:
    app: wqs-welcome
  ports:
  - name: https
    port: 8443
    targetPort: https
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wqs-welcome
  namespace: qsim
spec:
  podSelector:
    matchLabels:
      app: wqs-welcome
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: laminarauth
      podSelector:
        matchLabels:
          app.kubernetes.io/name: laminarauth-console
    ports:
    - protocol: TCP
      port: 8443
  egress:
  - to:
    - ipBlock:
        cidr: 192.168.1.205/32
    ports:
    - protocol: TCP
      port: 6443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

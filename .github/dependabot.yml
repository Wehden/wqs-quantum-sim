version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /deploy/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # The API project resolves qsim from the root of this repository.
      - dependency-name: qsim
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

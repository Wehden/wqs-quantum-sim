name: CI
run-name: ${{ inputs.local_parent_run && format('ci-local-{0}-{1}-{2}', inputs.local_parent_run, inputs.local_parent_attempt, inputs.local_checkout_sha) || github.event.pull_request.title || github.event.head_commit.message || 'CI' }}
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosted_tests:
        description: Exercise GitHub-hosted setup and tests instead of Standpunkt
        type: boolean
        default: false
      local_parent_run:
        description: Internal local attempt parent run ID
        type: string
      local_parent_attempt:
        description: Internal parent attempt
        type: string
      local_checkout_sha:
        description: Internal immutable checkout SHA
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.local_parent_run && format('child-{0}-{1}', inputs.local_parent_run, inputs.local_parent_attempt) || github.ref }}
  cancel-in-progress: true
jobs:
  route:
    if: ${{ !inputs.local_parent_run }}
    name: Choose and explain CI path
    runs-on: ubuntu-24.04
    outputs:
      lane: ${{ steps.choose.outputs.lane || steps.hosted.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only trusted events may execute a router from this checkout.
      - id: choose
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
        env:
          LOCAL_ENABLED: ${{ vars.WQS_LOCAL_CI_ENABLED }}
          CI_LOCAL_RUNNER_STATUS: ${{ vars.CI_LOCAL_RUNNER_STATUS }}
        run: python3 tools/ci/route.py
      - id: hosted
        if: ${{ !((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')) }}
        run: echo "lane=hosted" >> "$GITHUB_OUTPUT"
  attempt:
    name: Bounded local assignment
    needs: route
    if: >-
      github.actor != 'dependabot[bot]' && needs.route.outputs.lane == 'local' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    outputs:
      lane: ${{ steps.attempt.outputs.lane }}
      outcome: ${{ steps.attempt.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: attempt
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_PARENT_RUN: ${{ github.run_id }}
          LOCAL_PARENT_ATTEMPT: ${{ github.run_attempt }}
          LOCAL_CHECKOUT_SHA: ${{ github.sha }}
          LOCAL_DISPATCH_REF: ${{ github.head_ref || github.ref_name }}
        run: exec python3 tools/ci/local_attempt.py
      - name: Reconcile known child after interruption
        if: always()
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_PARENT_RUN: ${{ github.run_id }}
          LOCAL_PARENT_ATTEMPT: ${{ github.run_attempt }}
          LOCAL_CHECKOUT_SHA: ${{ github.sha }}
        run: exec python3 tools/ci/local_attempt.py --cleanup
  validate-child:
    name: Validate internal local attempt
    if: github.event_name == 'workflow_dispatch' && inputs.local_parent_run != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_ENABLED: ${{ vars.WQS_LOCAL_CI_ENABLED }}
          LOCAL_PARENT_RUN: ${{ inputs.local_parent_run }}
          LOCAL_PARENT_ATTEMPT: ${{ inputs.local_parent_attempt }}
          LOCAL_CHECKOUT_SHA: ${{ inputs.local_checkout_sha }}
        run: python3 tools/ci/local_attempt.py --validate
  local:
    name: Local execution
    needs: validate-child
    if: ${{ !cancelled() && needs.validate-child.result == 'success' }}
    runs-on: [self-hosted, Linux, X64, wqs-ci-local]
    outputs:
      tests: ${{ steps.tests.outcome }}
      artifact: ${{ steps.artifact.outcome }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.local_checkout_sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          node-version: '22'
      - name: Install pinned environment tool
        if: runner.environment == 'github-hosted'
        run: python -m pip install uv==0.11.6
      - name: Test all three simulators and API contracts
        id: tests
        run: bash tools/ci/check.sh
      - name: Retain test results
        id: artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/*.xml
          retention-days: 14
  hosted:
    name: GitHub-hosted / Clifft + Google qsim + Aer / Python 3.12
    needs: [route, attempt]
    if: >-
      always() && !cancelled() && needs.route.result == 'success' &&
      (needs.route.outputs.lane == 'hosted' || (needs.attempt.result == 'success' && needs.attempt.outputs.lane == 'hosted' && needs.attempt.outputs.outcome == 'capacity_unavailable'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          node-version: '22'
      - name: Install pinned environment tool
        if: runner.environment == 'github-hosted'
        run: python -m pip install uv==0.11.6
      - name: Test all three simulators and API contracts
        id: tests
        run: bash tools/ci/check.sh
      - name: Retain test results
        id: artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/*.xml
          retention-days: 14
  worker-image:
    if: ${{ !inputs.local_parent_run }}
    name: GitHub-hosted / API, controller and worker images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify deployable images
        run: bash tools/ci/check-release.sh
      - name: Build and check deployment runner tools without credentials
        run: bash tools/ci/check-deployment-runner.sh
      - name: Retain tested release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wqs-release-${{ github.sha }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  result:
    name: CI result and path
    needs: [route, attempt, hosted, worker-image]
    if: always() && !inputs.local_parent_run
    runs-on: ubuntu-24.04
    steps:
      - name: Report actual execution and gate the result
        env:
          ROUTE: ${{ needs.route.outputs.lane }}
          ROUTE_RESULT: ${{ needs.route.result }}
          ATTEMPT_RESULT: ${{ needs.attempt.result }}
          ATTEMPT_LANE: ${{ needs.attempt.outputs.lane }}
          ATTEMPT_OUTCOME: ${{ needs.attempt.outputs.outcome }}
          IMAGE_RESULT: ${{ needs.worker-image.result }}
          HOSTED_RESULT: ${{ needs.hosted.result }}
        run: |
          python3 - <<'PY'
          import os
          local_ok = os.environ['ATTEMPT_RESULT'] == 'success' and os.environ['ATTEMPT_OUTCOME'] == 'success'
          capacity = os.environ['ATTEMPT_RESULT'] == 'success' and os.environ['ATTEMPT_LANE'] == 'hosted' and os.environ['ATTEMPT_OUTCOME'] == 'capacity_unavailable'
          if os.environ['ROUTE'] == 'local' and local_ok:
              detail = 'Local execution passed; hosted tests skipped.'
              passed = os.environ['HOSTED_RESULT'] == 'skipped'
          elif os.environ['ROUTE'] == 'hosted' or capacity:
              detail = 'Local capacity unavailable or hosted requested. Hosted tests: ' + os.environ['HOSTED_RESULT'] + '.'
              passed = os.environ['HOSTED_RESULT'] == 'success'
          else:
              detail = 'Local execution or admission controller failed. No hosted retry.'
              passed = False
          detail += ' Release images and deployment runner tools (GitHub-hosted): ' + os.environ['IMAGE_RESULT'] + '.'
          passed = passed and os.environ['IMAGE_RESULT'] == 'success'
          print(detail)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Actual CI path\n\n' + detail + '\n\nBoth test lanes cover Clifft, Google qsim, Aer, installed SkyPilot contracts, and API/console behavior. All three deployable image checks and the credential-free deployment-runner tool check run separately on GitHub-hosted infrastructure because the isolated Standpunkt runner has no Docker daemon. Routing and this result report run on GitHub-hosted infrastructure.\n')
          raise SystemExit(0 if passed and os.environ['ROUTE_RESULT'] == 'success' else 1)
          PY

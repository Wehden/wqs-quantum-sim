name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  route:
    name: Choose and explain CI path
    runs-on: ubuntu-24.04
    outputs:
      lane: ${{ steps.choose.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: choose
        env:
          LOCAL_ENABLED: ${{ vars.WQS_LOCAL_CI_ENABLED }}
        run: python3 tools/ci/route.py
  local:
    name: Standpunkt / Clifft + Google qsim + Aer / Python 3.12
    needs: route
    if: needs.route.outputs.lane == 'local'
    runs-on: [self-hosted, Linux, X64, wqs-local]
    continue-on-error: true
    outputs:
      tests: ${{ steps.tests.outcome }}
      artifact: ${{ steps.artifact.outcome }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          node-version: '22'
      - name: Install pinned environment tool
        if: runner.environment == 'github-hosted'
        run: python -m pip install uv==0.11.6
      - name: Test all three simulators and API contracts
        id: tests
        run: bash tools/ci/check.sh
      - name: Retain test results
        id: artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/*.xml
          retention-days: 14
  hosted:
    name: GitHub-hosted / Clifft + Google qsim + Aer / Python 3.12
    needs: [route, local]
    if: >-
      always() && !cancelled() && needs.route.result == 'success' &&
      (needs.route.outputs.lane == 'hosted' || needs.local.outputs.tests != 'success' || needs.local.outputs.artifact != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          node-version: '22'
      - name: Install pinned environment tool
        if: runner.environment == 'github-hosted'
        run: python -m pip install uv==0.11.6
      - name: Test all three simulators and API contracts
        id: tests
        run: bash tools/ci/check.sh
      - name: Retain test results
        id: artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/*.xml
          retention-days: 14
  worker-image:
    name: GitHub-hosted / packaged worker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify isolated worker package
        run: bash tools/ci/check-worker.sh
  result:
    name: CI result and path
    needs: [route, local, hosted, worker-image]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report actual execution and gate the result
        env:
          ROUTE: ${{ needs.route.outputs.lane }}
          ROUTE_RESULT: ${{ needs.route.result }}
          LOCAL_TESTS: ${{ needs.local.outputs.tests }}
          LOCAL_ARTIFACT: ${{ needs.local.outputs.artifact }}
          IMAGE_RESULT: ${{ needs.worker-image.result }}
          HOSTED_RESULT: ${{ needs.hosted.result }}
        run: |
          python3 - <<'PY'
          import os
          local_ok = os.environ['LOCAL_TESTS'] == 'success' and os.environ['LOCAL_ARTIFACT'] == 'success'
          if os.environ['ROUTE'] == 'local' and local_ok:
              detail = 'Standpunkt: passed. GitHub-hosted test suite: skipped (fallback not needed).'
              passed = os.environ['HOSTED_RESULT'] == 'skipped'
          elif os.environ['ROUTE'] == 'local':
              detail = 'Standpunkt: unsuccessful. GitHub-hosted retry: ' + os.environ['HOSTED_RESULT'] + '.'
              passed = os.environ['HOSTED_RESULT'] == 'success'
          else:
              detail = 'Standpunkt: skipped by routing. GitHub-hosted test suite: ' + os.environ['HOSTED_RESULT'] + '.'
              passed = os.environ['HOSTED_RESULT'] == 'success'
          detail += ' Worker image (GitHub-hosted): ' + os.environ['IMAGE_RESULT'] + '.'
          passed = passed and os.environ['IMAGE_RESULT'] == 'success'
          print(detail)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Actual CI path\n\n' + detail + '\n\nBoth test lanes cover Clifft, Google qsim, and API/console behavior. Worker image checks run separately on GitHub-hosted infrastructure because the isolated Standpunkt runner has no Docker daemon. Routing and this result report run on GitHub-hosted infrastructure.\n')
          raise SystemExit(0 if passed and os.environ['ROUTE_RESULT'] == 'success' else 1)
          PY

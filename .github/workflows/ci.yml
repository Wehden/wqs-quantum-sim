name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  route:
    name: Choose CI lane
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
      - id: choose
        env:
          LOCAL_ENABLED: ${{ vars.WQS_LOCAL_CI_ENABLED }}
        run: |
          python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          kind = os.environ['GITHUB_EVENT_NAME']
          trusted_pr = kind == 'pull_request' and event['pull_request']['head']['repo']['full_name'] == os.environ['GITHUB_REPOSITORY']
          trusted_push = kind == 'push' and os.environ['GITHUB_REF'] == 'refs/heads/main'
          local = os.environ.get('LOCAL_ENABLED') == 'true' and (trusted_pr or trusted_push)
          runner = ['self-hosted','Linux','X64','wqs-local'] if local else ['ubuntu-24.04']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('runner=' + json.dumps(runner) + '\n')
          PY
  test:
    name: Both engines / Python 3.12
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          node-version: '22'
      - name: Install pinned environment tool
        if: runner.environment == 'github-hosted'
        run: python -m pip install uv==0.11.6
      - name: Test both simulators and API contracts
        run: bash tools/ci/check.sh
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/*.xml
          retention-days: 14

name: CD
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: wqs-production
  cancel-in-progress: false
jobs:
  gate:
    if: vars.WQS_CD_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/cd/release.py gate
  deploy:
    needs: gate
    if: needs.gate.outputs.sha != ''
    runs-on: [self-hosted, Linux, X64, wqs-deploy]
    environment: production
    # About 191 minutes of bounded deployment calls (including local image cleanup), plus artifact/runner overhead.
    # Keep this above the stage budget documented in docs/releases.md.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wqs-release-${{ needs.gate.outputs.sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify, publish and deploy tested images
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_CONFIG: ${{ vars.WQS_RELEASE_CONFIG }}
        run: python3 tools/cd/release.py deploy --sha "$RELEASE_SHA" --run-id "$CI_RUN" --config "$RELEASE_CONFIG"
      - name: Retain sanitized receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-receipt-${{ needs.gate.outputs.sha }}
          path: release-receipt.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove downloaded archives
        if: always()
        run: rm -rf release

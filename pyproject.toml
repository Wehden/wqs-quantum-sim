[project]
name = "qsim"
version = "0.1.0"
description = "Authenticated Clifft simulation service orchestrated by SkyPilot"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.149.0", "uvicorn==0.35.0", "httpx==0.28.1", "pyyaml==6.0.3", "cryptography==50.0.2"]

[project.optional-dependencies]
backup = [
    "bech32==1.2.0",
    "boto3==1.43.114",
    "jsonschema==4.26.0",
    "numpy==2.5.4",
]
worker = [
    "clifft==0.12.0",
    "numpy==2.5.4",
    "ply==3.11",
    "qsimcirq==0.22.1",
    "qiskit==2.6.0",
    "qiskit-aer==0.17.2",
    "qiskit-qasm3-import==0.6.0",
]
controller = ["skypilot[kubernetes]==0.14.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "jsonschema==4.26.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
